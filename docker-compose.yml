version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cs2-coaching-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cs2_coaching
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: cs2-coaching-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cs2_coaching?schema=public
      NEXTAUTH_SECRET: your-super-secret-key-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm run db:push && npm run dev"

volumes:
  postgres_data: