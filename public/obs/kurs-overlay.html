<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background: transparent;
  width: 1120px;
  height: 520px;
  overflow: hidden;
  font-family: 'Space Grotesk', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:root {
  --bg:    #060606;
  --text:  #e8e8e8;
  --muted: #8a8a8a;
  --dim:   #4a4a4a;
  --line:  rgba(255,255,255,0.08);
  --line2: rgba(255,255,255,0.14);
  --glass: rgba(255,255,255,0.035);
}

.wrap {
  width: 1120px;
  height: 520px;
  position: relative;
  overflow: hidden;
  border-radius: 40px;
}
.wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 40px;
  border: 3px solid var(--line2);
  pointer-events: none;
  z-index: 30;
}

.banner {
  position: absolute;
  inset: 0;
  border-radius: 40px;
  background: var(--bg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.grid-overlay {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 2;
}

.hero-glow {
  position: absolute;
  width: 900px; height: 450px;
  left: 50%; top: -120px;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(255,255,255,0.14), transparent 65%);
  filter: blur(90px);
  pointer-events: none;
  animation: glowPulse 10s ease-in-out infinite alternate;
  z-index: 3;
}
@keyframes glowPulse {
  0%   { opacity: 0.7; transform: translateX(-52%) scale(0.95); }
  100% { opacity: 1;   transform: translateX(-48%) scale(1.05); }
}

.grain {
  position: absolute;
  inset: 0;
  border-radius: 40px;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 300px;
  pointer-events: none;
  z-index: 4;
}

.top-edge {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.3) 50%, transparent 95%);
  z-index: 10;
}

.sweep {
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.03) 50%, transparent 70%);
  animation: sweep 9s ease-in-out infinite;
  transform: translateX(-150%);
  pointer-events: none;
  z-index: 5;
}
@keyframes sweep {
  0%   { transform: translateX(-150%); }
  22%, 100% { transform: translateX(150%); }
}

/* ── CONTENT ── */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 6;
  padding: 50px 40px 20px;
  gap: 20px;
}

.badge-row {
  display: inline-flex;
  align-items: center;
  gap: 16px;
  padding: 12px 32px;
  border: 2px solid var(--line2);
  border-radius: 999px;
  background: var(--glass);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.badge-row::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: translateX(-100%);
  animation: badgeShine 4s ease-in-out infinite;
}
@keyframes badgeShine {
  0%, 55% { transform: translateX(-100%); }
  100%     { transform: translateX(100%); }
}
.badge-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: rgba(255,255,255,0.75);
  flex-shrink: 0;
  animation: dotPulse 2.4s ease-in-out infinite;
}
@keyframes dotPulse {
  0%, 100% { opacity: 0.4; transform: scale(0.8); }
  50%       { opacity: 1; transform: scale(1.2); }
}
.badge-text {
  font-size: 22px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 5px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ── HEADLINE SLOT ── */
.headlines {
  position: relative;
  width: 100%;
  height: 150px;
  overflow: hidden;
}
.headline {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  font-weight: 700;
  letter-spacing: -2px;
  line-height: 1.1;
  color: var(--text);
  text-align: center;
  white-space: normal;
  word-break: keep-all;
  overflow: hidden;
  will-change: transform, opacity;
  pointer-events: none;
  padding: 0 10px;
}

.subs {
  position: relative;
  width: 100%;
  height: 50px;
  overflow: hidden;
  margin-top: -43px;
}
.sub {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 31px;
  font-weight: 500;
  color: var(--muted);
  text-align: center;
  white-space: normal;
  overflow: hidden;
  padding: 0 20px;
  will-change: transform, opacity;
  pointer-events: none;
}

/* ── ANIMATION STATES ── */
.headline.s-enter { opacity: 0; transform: translateY(40px); }
.sub.s-enter      { opacity: 0; transform: translateY(24px); }

.headline.s-active {
  opacity: 1; transform: translateY(0);
  transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1), transform 0.65s cubic-bezier(0.22,1,0.36,1);
}
.sub.s-active {
  opacity: 1; transform: translateY(0);
  transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1) 0.08s, transform 0.65s cubic-bezier(0.22,1,0.36,1) 0.08s;
}

.headline.s-exit {
  opacity: 0; transform: translateY(-30px);
  transition: opacity 0.35s cubic-bezier(0.4,0,1,1), transform 0.38s cubic-bezier(0.4,0,1,1);
}
.sub.s-exit {
  opacity: 0; transform: translateY(-20px);
  transition: opacity 0.3s cubic-bezier(0.4,0,1,1) 0.03s, transform 0.32s cubic-bezier(0.4,0,1,1) 0.03s;
}

.headline.s-active .ch {
  display: inline-block;
  animation: chIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes chIn {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── LINK PANEL ── */
.link-panel {
  position: absolute;
  inset: 0;
  z-index: 15;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 24px;
  background: var(--bg);
  transform: translateY(102%);
  transition: transform 0.9s cubic-bezier(0.16,1,0.3,1);
  will-change: transform;
  padding: 0 40px;
}
.link-panel.show { transform: translateY(0); }

.link-panel .top-edge {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent 5%, rgba(255,255,255,0.3) 50%, transparent 95%);
}

.link-eyebrow {
  font-size: 22px;
  font-weight: 500;
  color: var(--dim);
  letter-spacing: 7px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.5s ease 0.3s, transform 0.5s ease 0.3s;
  white-space: nowrap;
}
.link-panel.show .link-eyebrow { opacity: 1; transform: translateY(0); }

.link-url {
  font-size: 68px;
  font-weight: 700;
  letter-spacing: -2px;
  color: #fff;
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1) 0.18s, transform 0.6s cubic-bezier(0.22,1,0.36,1) 0.18s;
}
.link-panel.show .link-url { opacity: 1; transform: translateY(0); }

.link-url::after {
  content: '';
  display: block;
  height: 3px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.6s cubic-bezier(0.22,1,0.36,1) 0.7s;
}
.link-panel.show .link-url::after { transform: scaleX(1); }

.link-cta {
  font-size: 20px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 5px;
  text-transform: uppercase;
  border: 2px solid var(--line2);
  border-radius: 16px;
  padding: 14px 44px;
  background: rgba(255,255,255,0.05);
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.4s ease 0.62s, transform 0.4s ease 0.62s;
  white-space: nowrap;
}
.link-panel.show .link-cta { opacity: 1; transform: translateY(0); }

/* ── BOTTOM BAR ── */
.bar {
  flex-shrink: 0;
  height: 100px;
  border-top: 2px solid var(--line);
  background: rgba(0,0,0,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  position: relative;
  z-index: 7;
  overflow: hidden;
}
.bar::before {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}

.bar-logo {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 2px solid var(--line2);
  background: var(--glass);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.bar-logo svg { width: 24px; height: 24px; fill: var(--text); }

.bar-name {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
  white-space: nowrap;
}
.bar-sep {
  width: 2px; height: 26px;
  background: var(--line2);
}
.bar-right {
  font-size: 24px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <div class="grid-overlay"></div>
    <div class="hero-glow"></div>
    <div class="grain"></div>
    <div class="top-edge"></div>
    <div class="sweep"></div>

    <div class="content">
      <div class="badge-row">
        <span class="badge-dot"></span>
        <span class="badge-text" id="tagEl">KURS CS2</span>
      </div>
      <div class="headlines" id="headlines"></div>
      <div class="subs" id="subs"></div>
    </div>

    <div class="link-panel" id="linkPanel">
      <div class="top-edge"></div>
      <div class="link-eyebrow">Zobacz pełny kurs</div>
      <div class="link-url">dareycs2.vercel.app</div>
      <div class="link-cta">Sprawdź teraz →</div>
    </div>

    <div class="bar">
      <div class="bar-logo">
        <svg viewBox="0 0 24 24"><path d="M4 2h7a8 8 0 0 1 8 8v4a8 8 0 0 1-8 8H4V2zm3 3v14h4a5 5 0 0 0 5-5v-4a5 5 0 0 0-5-5H7z"/></svg>
      </div>
      <div class="bar-name">@DareyCS2</div>
      <div class="bar-sep"></div>
      <div class="bar-right">dareycs2.vercel.app</div>
    </div>
  </div>
</div>

<script>
// ══════════════ KONFIGURACJA — EDYTUJ TUTAJ ══════════════
const slides = [
  { tag:"KURS CS2",              h:"Jeden plan. Zero chaosu.",       s:"Kompletny plan treningowy — ćwiczenie po ćwiczeniu." },
  { tag:"CO ĆWICZENIE ILE CZASU", h:"Dokładnie rozpisane",           s:"Każde ćwiczenie ma swój czas — otwierasz i robisz." },
  { tag:"FILM DO KAŻDEGO ĆW.",    h:"Widzisz, jak to robić",          s:"Do każdego ćwiczenia nagrany film instruktażowy." },
  { tag:"WYJAŚNIENIE TEKSTEM",    h:"Rozumiesz, po co to robisz",     s:"Do tego wyjaśnienie w formie tekstu — nie tylko naśladowanie." },
  { tag:"OTWIERASZ I TRENUJESZ",  h:"Cały trening w jednym miejscu",  s:"Plan + film + wyjaśnienia. Reszta to tylko robota." }
];

const SLIDE_MS          = 6700;  // czas jednego slajdu
const SLIDES_BEFORE_LINK = 3;    // po ilu slajdach pokazać panel z linkiem
const LINK_MS           = 6700;  // jak długo wisi panel z linkiem
// ═════════════════════════════════════════════════════════

const headlinesEl = document.getElementById('headlines');
const subsEl      = document.getElementById('subs');
const tagEl       = document.getElementById('tagEl');
const linkPanel   = document.getElementById('linkPanel');

let current   = 0;
let showCount = 0;
let isLink    = false;
let timer     = null;

function buildSlides() {
  slides.forEach((s, i) => {
    const h = document.createElement('div');
    h.className = 'headline s-enter';
    h.id = `h${i}`;
    headlinesEl.appendChild(h);

    const sub = document.createElement('div');
    sub.className = 'sub s-enter';
    sub.id = `s${i}`;
    sub.textContent = s.s;
    subsEl.appendChild(sub);
  });
}

function splitChars(el, text) {
  el.innerHTML = text.split('').map((ch, i) => {
    if (ch === ' ') return '&nbsp;';
    return `<span class="ch" style="animation-delay:${i*0.022}s">${ch}</span>`;
  }).join('');
}

function activate(idx) {
  const h   = document.getElementById(`h${idx}`);
  const sub = document.getElementById(`s${idx}`);
  h.className  = 'headline s-enter';
  sub.className = 'sub s-enter';
  tagEl.textContent = slides[idx].tag;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    h.className  = 'headline s-active';
    sub.className = 'sub s-active';
    splitChars(h, slides[idx].h);
  }));
}

function exitSlide(idx) {
  const h   = document.getElementById(`h${idx}`);
  const sub = document.getElementById(`s${idx}`);
  if (h)   h.className = 'headline s-exit';
  if (sub) sub.className = 'sub s-exit';
}

function nextSlide() {
  const prev = current;
  current = (current + 1) % slides.length;
  exitSlide(prev);
  setTimeout(() => activate(current), 90);
}

function showLink() {
  isLink = true;
  linkPanel.classList.add('show');
  timer = setTimeout(() => {
    linkPanel.classList.remove('show');
    isLink = false;
    showCount = 0;
    timer = setTimeout(tick, 900);
  }, LINK_MS);
}

function tick() {
  if (isLink) return;
  showCount++;
  nextSlide();
  timer = setTimeout(showCount >= SLIDES_BEFORE_LINK ? showLink : tick, SLIDE_MS);
}

buildSlides();
activate(0);
timer = setTimeout(tick, SLIDE_MS);
</script>
</body>
</html>
